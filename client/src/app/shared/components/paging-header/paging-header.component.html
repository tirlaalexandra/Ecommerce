<header>
  <span *ngIf="totalCount && totalCount > 0" class="text-muted"
    >Showing
    <strong
      >{{ (pageNumber - 1) * pageSize + 1 }}
      -
      {{
        pageNumber * pageSize > this.totalCount
          ? this.totalCount
          : pageNumber * pageSize
      }}
    </strong>
    of <strong>{{ this.totalCount }}</strong> Results</span
  >
  <span *ngIf="totalCount === 0" class="text-muted">There are <strong>0</strong> results</span>
</header>
